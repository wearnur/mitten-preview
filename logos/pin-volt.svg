<svg class="mark mark-pin" viewBox="0 0 64 64" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="256" height="256"><style>svg{--l-ink:#0d0f12;--l-main:#c8f031;--l-hi:#c8f031;--l-soft:#f4fbdc;--l-spark:#fff}
.mark-pin .pin{animation:mm-drop .9s cubic-bezier(.3,1.5,.5,1) .15s both}
.mark-pin .ring{transform-box:fill-box;transform-origin:center;animation:mm-ring 2.6s ease-out 1.1s infinite}
.mark-shine .gleam{animation:mm-gleam 5.5s ease-in-out .8s infinite}
.mark-drop .mline{stroke-dasharray:100;stroke-dashoffset:100;animation:mm-draw 1s .1s cubic-bezier(.65,.05,.25,1) forwards}
.mark-drop .drop{animation:mm-drip 3.2s ease-in 1.2s infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:mm-twinkle 3.6s ease-in-out 1.2s infinite}
@keyframes mm-drop{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
@keyframes mm-ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes mm-gleam{0%{transform:translateX(-30px)}24%,100%{transform:translateX(86px)}}
@keyframes mm-draw{to{stroke-dashoffset:0}}
@keyframes mm-drip{0%{transform:translateY(-3px);opacity:0}15%,55%{transform:none;opacity:1}85%{transform:translateY(12px);opacity:0}100%{opacity:0}}
@keyframes mm-twinkle{0%,100%{transform:scale(.85) rotate(0)}45%{transform:scale(1.2) rotate(45deg)}60%{transform:scale(.95) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){.mark *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}.mark-pin .ring{display:none}}
</style>
<path d="M18 57C13 51 10.5 41 11.5 30C12.5 17 18.5 8.5 28 7.5C37.5 6.5 43.5 12.5 44.5 22L44.8 29.5C47 24.8 50.8 22.3 54.6 23.4C58.6 24.6 59.6 30 57.6 35.6C55.6 41.4 51.6 46.4 48.6 50.4L47.6 57Z" style="fill:var(--l-main)"/>
<ellipse class="ring" cx="45" cy="56.4" rx="5.5" ry="1.9" fill="none" style="stroke:var(--l-ink)" stroke-width="1.6"/>
<g class="pin"><path d="M45 33.5c-4.8 0-8.6 3.7-8.6 8.2 0 6 8.6 14.3 8.6 14.3s8.6-8.3 8.6-14.3c0-4.5-3.8-8.2-8.6-8.2z" style="fill:var(--l-ink)"/>
<circle cx="45" cy="41.8" r="3.1" style="fill:var(--l-main)"/></g>
</svg>